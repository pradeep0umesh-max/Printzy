<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1264e8">
<title>Printzy - Premium Custom Products</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--blue:#1264e8;
--blue2:#0645b5;
--sky:#eaf3ff;
--bg:#f6f9ff;
--card:#fff;
--text:#172033;
--muted:#64748b;
--border:#dce7f7;
--danger:#ef3155;
--success:#16a34a;
--warning:#f59e0b;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
transition:.3s;
}

body.dark{
--bg:#08111f;
--card:#111c2d;
--text:#f5f8ff;
--muted:#aab6ca;
--border:#263852;
--sky:#12243d;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.loader{
position:fixed;
inset:0;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
}

.loader-logo{
color:var(--blue);
font-size:44px;
font-weight:900;
animation:pulse 1s infinite alternate;
}

@keyframes pulse{
from{transform:scale(.9);opacity:.5}
to{transform:scale(1.08);opacity:1}
}

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(255,255,255,.94);
backdrop-filter:blur(15px);
border-bottom:1px solid var(--border);
}

body.dark header{
background:rgba(17,28,45,.95);
}

.nav{
max-width:1200px;
margin:auto;
padding:13px 18px;
display:flex;
align-items:center;
gap:12px;
}

.logo{
font-size:29px;
font-weight:900;
color:var(--blue);
}

.logo span{color:var(--text)}

.search-box{
flex:1;
position:relative;
}

.search{
width:100%;
padding:13px 45px 13px 18px;
border:2px solid var(--border);
border-radius:30px;
outline:none;
background:var(--card);
color:var(--text);
}

.search:focus{
border-color:var(--blue);
box-shadow:0 0 0 4px rgba(18,100,232,.1);
}

.search-icon{
position:absolute;
right:17px;
top:12px;
}

.icon-btn{
width:45px;
height:45px;
border:1px solid var(--border);
border-radius:50%;
background:var(--card);
color:var(--text);
font-size:19px;
position:relative;
}

.count{
position:absolute;
top:-4px;
right:-3px;
width:19px;
height:19px;
border-radius:50%;
background:var(--danger);
color:white;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.cart-btn{
border:0;
background:var(--blue);
color:white;
padding:13px 18px;
border-radius:28px;
font-weight:bold;
}

.hero-wrap{
max-width:1200px;
margin:25px auto;
padding:0 18px;
}

.hero{
min-height:400px;
border-radius:30px;
padding:65px 50px;
color:#fff;
position:relative;
overflow:hidden;
background:linear-gradient(135deg,#0755ca,#1684ff);
box-shadow:0 20px 45px rgba(18,100,232,.25);
}

.hero h1{
font-size:55px;
margin-bottom:18px;
position:relative;
z-index:2;
}

.hero p{
max-width:650px;
line-height:1.7;
font-size:18px;
position:relative;
z-index:2;
}

.shop-btn{
margin-top:27px;
padding:14px 25px;
border:0;
border-radius:30px;
background:#fff;
color:var(--blue);
font-weight:bold;
position:relative;
z-index:2;
}

.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.12);
}

.one{
width:240px;
height:240px;
right:-60px;
top:-70px;
}

.two{
width:150px;
height:150px;
right:220px;
bottom:-70px;
}

.three{
width:80px;
height:80px;
right:80px;
bottom:70px;
}

.container{
max-width:1200px;
margin:auto;
padding:10px 18px 60px;
}

.section-title{
font-size:30px;
margin:32px 0 18px;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:8px;
}

.category{
white-space:nowrap;
padding:11px 20px;
border-radius:30px;
border:1px solid var(--border);
background:var(--card);
color:var(--text);
}

.category.active{
background:var(--blue);
color:#fff;
border-color:var(--blue);
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:22px;
}

.product{
background:var(--card);
border:1px solid var(--border);
border-radius:22px;
overflow:hidden;
position:relative;
box-shadow:0 5px 18px rgba(0,0,0,.05);
transition:.25s;
}

.product:hover{
transform:translateY(-6px);
box-shadow:0 15px 35px rgba(18,100,232,.15);
}

.product-img{
height:210px;
background:linear-gradient(145deg,#edf5ff,#dcecff);
display:flex;
align-items:center;
justify-content:center;
font-size:88px;
position:relative;
}

body.dark .product-img{
background:#152944;
}

.badge{
position:absolute;
top:12px;
left:12px;
background:var(--blue);
color:#fff;
padding:6px 10px;
border-radius:20px;
font-size:11px;
font-weight:bold;
}

.wishlist{
position:absolute;
right:12px;
top:12px;
width:43px;
height:43px;
border:1px solid #d9e5f6;
border-radius:50%;
background:white;
color:#64748b;
font-size:23px;
z-index:3;
}

.wishlist.active{
color:var(--danger);
background:#fff0f3;
}

.product-info{
padding:18px;
}

.product-info h3{
margin-bottom:7px;
}

.rating{
color:#f59e0b;
font-size:13px;
margin-bottom:8px;
}

.price{
color:var(--blue);
font-size:20px;
font-weight:bold;
}

.details-btn,
.customize,
.add,
.primary{
width:100%;
margin-top:10px;
padding:11px;
border-radius:12px;
font-weight:bold;
}

.details-btn,
.customize{
border:1px solid var(--blue);
background:transparent;
color:var(--blue);
}

.add,
.primary{
border:0;
background:var(--blue);
color:#fff;
}

.add:hover,
.primary:hover{
background:var(--blue2);
}

.modal{
display:none;
position:fixed;
inset:0;
z-index:5000;
background:rgba(0,0,0,.68);
align-items:center;
justify-content:center;
padding:18px;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:620px;
max-height:92vh;
overflow:auto;
padding:25px;
background:var(--card);
color:var(--text);
border-radius:24px;
}

.close{
float:right;
border:0;
background:none;
color:var(--text);
font-size:30px;
}

.detail-icon{
height:190px;
border-radius:18px;
background:linear-gradient(145deg,#edf5ff,#dcecff);
display:flex;
align-items:center;
justify-content:center;
font-size:100px;
margin-bottom:18px;
}

.detail-title{
font-size:28px;
margin-bottom:8px;
}

.detail-price{
color:var(--blue);
font-size:26px;
font-weight:bold;
margin:12px 0;
}

.features{
padding-left:22px;
line-height:2;
margin:12px 0;
}

.custom-input{
width:100%;
padding:12px;
margin:7px 0;
border:1px solid var(--border);
border-radius:10px;
background:var(--bg);
color:var(--text);
outline:none;
}

.cart-item{
padding:14px 0;
border-bottom:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.qty{
display:flex;
align-items:center;
gap:6px;
}

.qty button{
width:30px;
height:30px;
border:0;
border-radius:7px;
background:var(--sky);
color:var(--blue);
font-weight:bold;
}

.remove{
border:0;
background:#fff0f3;
color:var(--danger);
padding:7px 10px;
border-radius:8px;
}

.total{
color:var(--blue);
font-size:22px;
font-weight:bold;
margin:18px 0;
}

.info-box{
background:var(--sky);
padding:15px;
border-radius:12px;
margin:12px 0;
line-height:1.7;
}

.payment-option{
display:block;
border:2px solid var(--border);
border-radius:15px;
padding:15px;
margin:10px 0;
background:var(--card);
cursor:pointer;
}

.payment-option input{
margin-right:8px;
accent-color:var(--blue);
}

.payment-option.selected{
border-color:var(--blue);
background:var(--sky);
}

.status{
display:inline-block;
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.status.pending{
background:#fff7df;
color:#b77900;
}

.status.confirmed{
background:#e8f7ee;
color:var(--success);
}

.status.processing{
background:#eaf3ff;
color:var(--blue);
}

.status.shipped{
background:#eee9ff;
color:#6d42c7;
}

.status.delivered{
background:#e8f7ee;
color:var(--success);
}

.status.cancelled{
background:#fff0f3;
color:var(--danger);
}

.order-card{
border:1px solid var(--border);
border-radius:15px;
padding:15px;
margin:12px 0;
background:var(--card);
}

.order-header{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
margin-bottom:10px;
}

.order-number{
color:var(--blue);
font-weight:bold;
font-size:18px;
}

.admin-box{
border:1px solid var(--border);
border-radius:14px;
padding:15px;
margin:12px 0;
}

.empty{
text-align:center;
padding:45px 10px;
color:var(--muted);
}

.success{
text-align:center;
}

.success-icon{
width:75px;
height:75px;
margin:0 auto 15px;
border-radius:50%;
background:#e8f7ee;
color:var(--success);
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
}

footer{
background:#082e6d;
color:#fff;
text-align:center;
padding:40px 18px;
}

.footer-links{
margin-top:18px;
}

.footer-links button{
border:0;
background:none;
color:white;
margin:5px 10px;
}

@media(max-width:700px){

.nav{
flex-wrap:wrap;
}

.logo{
font-size:25px;
}

.search-box{
order:3;
flex-basis:100%;
}

.hero{
padding:45px 25px;
min-height:360px;
}

.hero h1{
font-size:38px;
}

.hero p{
font-size:16px;
}

.products{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.product-img{
height:150px;
font-size:62px;
}

.product-info{
padding:12px;
}

.product-info h3{
font-size:15px;
}

.details-btn,
.customize,
.add{
font-size:12px;
padding:10px;
}

.section-title{
font-size:25px;
}

.cart-btn{
padding:11px 13px;
}

.order-header{
align-items:flex-start;
flex-direction:column;
}

}
</style>
</head>

<body>

<div class="loader">
<div class="loader-logo">Printzy</div>
</div>

<header>
<div class="nav">

<div class="logo">Print<span>zy</span></div>

<div class="search-box">
<input
id="search"
class="search"
type="search"
placeholder="Search T-shirts, mugs, frames..."
oninput="searchProducts()">
<span class="search-icon">🔍</span>
</div>

<button
class="icon-btn"
onclick="toggleDark()"
title="Dark Mode">
🌙
</button>

<button
class="icon-btn"
onclick="openWishlist()"
title="Wishlist">

❤️
<span class="count" id="wishCount">0</span>

</button>

<button
class="cart-btn"
onclick="openCart()">

🛒 Cart <span id="cartCount">0</span>

</button>

</div>
</header>

<div class="hero-wrap">

<section class="hero">

<div class="circle one"></div>
<div class="circle two"></div>
<div class="circle three"></div>

<h1>Make it yours.</h1>

<p>
Create something special with premium customized
T-shirts, mugs, frames, hoodies, caps and personalized gifts.
</p>

<button
class="shop-btn"
onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">

Shop Now →

</button>

</section>
</div>

<div class="container">

<h2 class="section-title">
Explore Categories
</h2>

<div class="categories">

<button
class="category active"
onclick="filterCategory('All',this)">
All
</button>

<button
class="category"
onclick="filterCategory('Clothing',this)">
👕 Clothing
</button>

<button
class="category"
onclick="filterCategory('Mugs',this)">
☕ Mugs
</button>

<button
class="category"
onclick="filterCategory('Home',this)">
🏠 Home
</button>

<button
class="category"
onclick="filterCategory('Accessories',this)">
🎁 Accessories
</button>

</div>

<h2
class="section-title"
id="products">
Popular Products
</h2>

<div
class="products"
id="productList">
</div>

</div>

<footer>

<h2>Printzy</h2>

<p style="margin-top:8px">
Premium customized products made specially for you.
</p>

<div class="footer-links">

<button onclick="openTerms()">
Terms & Conditions
</button>

<button onclick="openPrivacy()">
Privacy Policy
</button>

<button onclick="openContact()">
Contact
</button>

<button onclick="openOrderHistory()">
Order History
</button>

<button onclick="openOrderManagement()">
⚙️ Order Management
</button>

</div>

<p style="margin-top:20px">
© 2026 Printzy. All rights reserved.
</p>

</footer>

<div class="modal" id="modal">

<div class="modal-box">

<button
class="close"
onclick="closeModal()">×</button>

<div id="modalContent"></div>

</div>
</div>


<script>

/* =====================================================
   PRINTZY COMPLETE JAVASCRIPT
   PAYMENT METHOD: CASH ON DELIVERY ONLY
===================================================== */


/* ================= PRODUCTS ================= */

const products=[

{
id:1,
name:"Custom T-Shirt",
price:499,
category:"Clothing",
icon:"👕",
badge:"POPULAR",
rating:"4.8",
description:"Premium quality custom printed T-shirt. Add your own name, photo, logo or design.",
features:[
"Premium cotton fabric",
"Custom print available",
"Comfortable regular fit",
"Multiple sizes available"
]
},

{
id:2,
name:"Personalized Mug",
price:299,
category:"Mugs",
icon:"☕",
badge:"BEST SELLER",
rating:"4.9",
description:"Create a personalized ceramic mug with your favourite photo, name or message.",
features:[
"High quality ceramic",
"Photo and text printing",
"Premium finish",
"Perfect for gifting"
]
},

{
id:3,
name:"Photo Frame",
price:399,
category:"Home",
icon:"🖼️",
badge:"NEW",
rating:"4.7",
description:"Turn your favourite memories into beautiful personalized photo frames.",
features:[
"Premium frame",
"Custom photo printing",
"Elegant design",
"Perfect home decoration"
]
},

{
id:4,
name:"Custom Hoodie",
price:899,
category:"Clothing",
icon:"🧥",
badge:"TRENDING",
rating:"4.8",
description:"Premium customized hoodie made for your unique style.",
features:[
"Soft comfortable fabric",
"Custom printing",
"Stylish fit",
"Multiple sizes"
]
},

{
id:5,
name:"Custom Cap",
price:349,
category:"Accessories",
icon:"🧢",
badge:"NEW",
rating:"4.6",
description:"Personalized cap with your name, logo or favourite design.",
features:[
"Premium material",
"Custom embroidery or print",
"Adjustable fit",
"Stylish everyday accessory"
]
},

{
id:6,
name:"Personalized Gift",
price:599,
category:"Accessories",
icon:"🎁",
badge:"POPULAR",
rating:"4.9",
description:"A special personalized gift designed to make your loved ones feel special.",
features:[
"Customizable design",
"Premium presentation",
"Perfect for special occasions",
"Made specially for you"
]
},

{
id:7,
name:"Custom Home Decor",
price:599,
category:"Home",
icon:"🏠",
badge:"POPULAR",
rating:"4.8",
description:"Personalized home decor created especially for your room and memories.",
features:[
"Customizable design",
"Premium presentation",
"Perfect for home decoration"
]
},

{
id:8,
name:"Custom Keychain",
price:199,
category:"Accessories",
icon:"🔑",
badge:"NEW",
rating:"4.7",
description:"Small personalized keychain with your name, photo or special message.",
features:[
"Lightweight",
"Custom design",
"Durable material",
"Great for gifting"
]
}

];


/* ================= STORAGE ================= */

let cart=JSON.parse(localStorage.getItem("printzyCart")) || [];

let wishlist=JSON.parse(localStorage.getItem("printzyWishlist")) || [];

let orders=JSON.parse(localStorage.getItem("printzyOrders")) || [];

let currentCategory="All";


/* ================= MODAL ================= */

function showModal(html){

document.getElementById("modalContent").innerHTML=html;

document.getElementById("modal").classList.add("show");

}


function closeModal(){

document.getElementById("modal").classList.remove("show");

}


document.getElementById("modal").addEventListener("click",function(e){

if(e.target===this){

closeModal();

}

});


/* ================= PRODUCT DISPLAY ================= */

function showProducts(list=products){

const box=document.getElementById("productList");

box.innerHTML="";

if(!list.length){

box.innerHTML=`

<div
class="empty"
style="grid-column:1/-1">

<h2>😔 No products found</h2>

<p style="margin-top:8px">
Try another search.
</p>

</div>

`;

return;

}


list.forEach(p=>{

const liked=wishlist.includes(p.id);

box.innerHTML+=`

<div class="product">

<button
class="wishlist ${liked?"active":""}"
onclick="toggleWishlist(${p.id})">

${liked?"♥":"♡"}

</button>

<div class="product-img">

<span class="badge">
${p.badge}
</span>

${p.icon}

</div>

<div class="product-info">

<h3>
${p.name}
</h3>

<div class="rating">

★★★★★

<span style="color:var(--muted)">
${p.rating}
</span>

</div>

<div class="price">
₹${p.price}
</div>

<button
class="details-btn"
onclick="showProductDetails(${p.id})">

👁️ View Details

</button>

<button
class="customize"
onclick="customizeProduct(${p.id})">

✨ Customize

</button>

<button
class="add"
onclick="addCart(${p.id},this)">

Add to Cart

</button>

</div>

</div>

`;

});

}


/* ================= PRODUCT DETAILS ================= */

function showProductDetails(id){

const p=products.find(x=>x.id===id);

if(!p)return;

const features=p.features
.map(x=>`<li>✓ ${x}</li>`)
.join("");

showModal(`

<div class="detail-icon">
${p.icon}
</div>

<h2 class="detail-title">
${p.name}
</h2>

<div class="rating">
★★★★★ ${p.rating}/5
</div>

<div class="detail-price">
₹${p.price}
</div>

<p style="line-height:1.7">
${p.description}
</p>

<h3 style="margin-top:18px">
Product Features
</h3>

<ul class="features">
${features}
</ul>

<button
class="customize"
onclick="customizeProduct(${p.id})">

✨ Customize This Product

</button>

<button
class="primary"
onclick="addCart(${p.id});closeModal()">

🛒 Add to Cart

</button>

`);

}


/* ================= CUSTOMIZATION ================= */

function customizeProduct(id){

const p=products.find(x=>x.id===id);

if(!p)return;

showModal(`

<h2>
✨ Customize Product
</h2>

<p style="margin:8px 0;color:var(--muted)">
Product: <strong>${p.name}</strong>
</p>

<input
class="custom-input"
id="customName"
placeholder="Your Name / Text">

<input
class="custom-input"
id="customPhoto"
placeholder="Photo / Design details">

<select
class="custom-input"
id="customSize">

<option value="">
Select Size (if applicable)
</option>

<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>

</select>

<textarea
class="custom-input"
id="customNote"
rows="4"
placeholder="Tell us your customization requirements"></textarea>

<button
class="primary"
onclick="saveCustomization(${p.id})">

💾 Save & Add to Cart

</button>

`);

}


function saveCustomization(id){

const p=products.find(x=>x.id===id);

if(!p)return;

const data={

productId:p.id,

product:p.name,

name:document.getElementById("customName").value.trim(),

photo:document.getElementById("customPhoto").value.trim(),

size:document.getElementById("customSize").value,

note:document.getElementById("customNote").value.trim()

};

localStorage.setItem(
"printzyCustomization",
JSON.stringify(data)
);

addCart(id);

closeModal();

alert("Customization saved and product added to cart! ❤️");

}


/* ================= CART ================= */

function addCart(id,button){

const p=products.find(x=>x.id===id);

if(!p)return;

const existing=cart.find(x=>x.id===id);

if(existing){

existing.qty++;

}else{

cart.push({
id:id,
qty:1
});

}

saveCart();

if(button){

const old=button.innerText;

button.innerText="✓ Added";

setTimeout(()=>{

button.innerText=old;

},900);

}

}


function saveCart(){

localStorage.setItem(
"printzyCart",
JSON.stringify(cart)
);

updateCounts();

}


function updateCounts(){

const count=cart.reduce(
(sum,item)=>sum+Number(item.qty),0
);

document.getElementById("cartCount").innerText=count;

document.getElementById("wishCount").innerText=wishlist.length;

}


/* ================= CART WINDOW ================= */

function openCart(){

let html="<h2>🛒 Your Cart</h2>";

if(!cart.length){

showModal(`

<div class="empty">

<h2>🛒 Cart is empty</h2>

<p style="margin-top:8px">
Add some products to continue.
</p>

</div>

`);

return;

}

let total=0;

cart.forEach((item,index)=>{

const p=products.find(x=>x.id===item.id);

if(!p)return;

total+=p.price*item.qty;

html+=`

<div class="cart-item">

<div>

<strong>
${p.icon} ${p.name}
</strong>

<div style="color:var(--blue);margin-top:5px">
₹${p.price} × ${item.qty}
</div>

</div>

<div>

<div class="qty">

<button
onclick="changeQty(${index},-1)">
−
</button>

<b>${item.qty}</b>

<button
onclick="changeQty(${index},1)">
+
</button>

</div>

<button
class="remove"
style="margin-top:6px"
onclick="removeCart(${index})">

Remove

</button>

</div>

</div>

`;

});

html+=`

<div class="total">
Total: ₹${total}
</div>

<div class="info-box">
💵 <strong>Payment Method: Cash on Delivery</strong>
<br>
<small>Pay when your order is delivered.</small>
</div>

<button
class="primary"
onclick="checkout()">
