<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Printzy - Premium Custom Products</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --blue:#1264e8;
  --blue2:#0645b5;
  --sky:#eaf3ff;
  --bg:#f6f9ff;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#dce7f7;
  --danger:#ef3155;
  --success:#16a34a;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  transition:.3s;
}

body.dark{
  --bg:#08111f;
  --card:#111c2d;
  --text:#f5f8ff;
  --muted:#aab6ca;
  --border:#263852;
  --sky:#12243d;
}

/* LOADER */

.loader{
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation:loaderOut 1s ease 1.2s forwards;
}

.loader-logo{
  color:var(--blue);
  font-size:42px;
  font-weight:900;
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(.9);opacity:.5}
  to{transform:scale(1.08);opacity:1}
}

@keyframes loaderOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

body.dark header{
  background:rgba(17,28,45,.94);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  font-size:29px;
  font-weight:900;
  color:var(--blue);
}

.logo span{
  color:var(--text);
}

.search-box{
  flex:1;
  position:relative;
}

.search{
  width:100%;
  padding:13px 45px 13px 18px;
  border:2px solid var(--border);
  border-radius:30px;
  background:var(--card);
  color:var(--text);
  outline:none;
  font-size:15px;
}

.search:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(18,100,232,.1);
}

.search-icon{
  position:absolute;
  right:17px;
  top:12px;
}

.icon-btn{
  width:45px;
  height:45px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-size:19px;
  position:relative;
  transition:.25s;
}

.icon-btn:hover{
  transform:translateY(-3px) scale(1.05);
}

.count{
  position:absolute;
  top:-4px;
  right:-2px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:var(--danger);
  color:white;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.cart-btn{
  border:0;
  background:var(--blue);
  color:white;
  padding:13px 18px;
  border-radius:28px;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
}

.cart-btn:hover{
  background:var(--blue2);
  transform:translateY(-2px);
}

/* HERO */

.hero-wrap{
  max-width:1200px;
  margin:25px auto;
  padding:0 18px;
}

.hero{
  min-height:390px;
  border-radius:30px;
  padding:65px 50px;
  color:white;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#0755ca,#1684ff);
  box-shadow:0 20px 45px rgba(18,100,232,.25);
  animation:heroIn .8s ease;
}

@keyframes heroIn{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.hero h1{
  font-size:54px;
  margin-bottom:18px;
  position:relative;
  z-index:2;
}

.hero p{
  font-size:18px;
  max-width:650px;
  line-height:1.7;
  position:relative;
  z-index:2;
}

.shop-btn{
  margin-top:27px;
  padding:14px 25px;
  border:0;
  border-radius:30px;
  background:white;
  color:var(--blue);
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  position:relative;
  z-index:2;
  transition:.25s;
}

.shop-btn:hover{
  transform:translateY(-3px) scale(1.03);
}

.circle{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  animation:float 6s ease-in-out infinite;
}

.one{
  width:230px;
  height:230px;
  right:-50px;
  top:-60px;
}

.two{
  width:150px;
  height:150px;
  right:230px;
  bottom:-70px;
}

.three{
  width:80px;
  height:80px;
  right:80px;
  bottom:70px;
}

@keyframes float{
  50%{transform:translateY(-18px)}
}

/* CONTENT */

.container{
  max-width:1200px;
  margin:auto;
  padding:10px 18px 60px;
}

.section-title{
  font-size:30px;
  margin:32px 0 18px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:8px;
}

.category{
  white-space:nowrap;
  padding:11px 20px;
  border-radius:30px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  transition:.25s;
}

.category:hover{
  transform:translateY(-2px);
  border-color:var(--blue);
}

.category.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.product{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
  position:relative;
  box-shadow:0 5px 18px rgba(0,0,0,.04);
  animation:cardIn .5s ease both;
  transition:.3s;
}

.product:hover{
  transform:translateY(-8px);
  box-shadow:0 15px 35px rgba(18,100,232,.15);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.product-img{
  height:215px;
  background:linear-gradient(145deg,#edf5ff,#dcecff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:90px;
  position:relative;
}

body.dark .product-img{
  background:#152944;
}

.badge{
  position:absolute;
  top:13px;
  left:13px;
  background:var(--blue);
  color:white;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.wishlist{
  position:absolute;
  right:13px;
  top:13px;
  width:43px;
  height:43px;
  border:1px solid #d9e5f6;
  border-radius:50%;
  background:white;
  color:#64748b;
  font-size:22px;
  cursor:pointer;
  z-index:3;
}

.wishlist.active{
  color:var(--danger);
  background:#fff0f3;
  animation:heartPop .35s ease;
}

@keyframes heartPop{
  50%{transform:scale(1.3)}
}

.product-info{
  padding:18px;
}

.product-info h3{
  margin-bottom:7px;
}

.rating{
  color:#f59e0b;
  font-size:13px;
  margin-bottom:8px;
}

.price{
  color:var(--blue);
  font-size:20px;
  font-weight:bold;
}

.details-btn,
.customize,
.add{
  width:100%;
  margin-top:10px;
  padding:11px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
}

.details-btn{
  border:1px solid var(--blue);
  background:transparent;
  color:var(--blue);
}

.details-btn:hover{
  background:var(--sky);
}

.customize{
  border:1px solid var(--blue);
  background:transparent;
  color:var(--blue);
}

.add{
  border:0;
  background:var(--blue);
  color:white;
}

.add:hover{
  background:var(--blue2);
  transform:translateY(-2px);
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:5000;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(5px);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow:auto;
  padding:25px;
  background:var(--card);
  color:var(--text);
  border-radius:24px;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
  animation:modalIn .3s ease;
}

@keyframes modalIn{
  from{
    transform:translateY(30px) scale(.95);
    opacity:0;
  }
  to{
    transform:translateY(0) scale(1);
    opacity:1;
  }
}

.close{
  float:right;
  border:0;
  background:none;
  color:var(--text);
  font-size:28px;
  cursor:pointer;
}

.detail-icon{
  height:190px;
  border-radius:18px;
  background:linear-gradient(145deg,#edf5ff,#dcecff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:100px;
  margin-bottom:20px;
}

.detail-title{
  font-size:28px;
  margin-bottom:8px;
}

.detail-price{
  color:var(--blue);
  font-size:25px;
  font-weight:bold;
  margin:12px 0;
}

.features{
  margin:15px 0;
  padding-left:20px;
  line-height:2;
}

.custom-input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  outline:none;
  font-family:inherit;
}

.custom-input:focus{
  border-color:var(--blue);
}

.total{
  color:var(--blue);
  font-size:21px;
  font-weight:bold;
  margin:18px 0;
}

.cart-item{
  padding:13px 0;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:var(--sky);
  color:var(--blue);
  cursor:pointer;
  font-weight:bold;
}

.remove{
  border:0;
  background:#fff0f3;
  color:var(--danger);
  padding:7px 10px;
  border-radius:8px;
  cursor:pointer;
}

.success{
  text-align:center;
}

.success-icon{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:50%;
  background:#e8f7ee;
  color:var(--success);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  animation:successPop .5s ease;
}

@keyframes successPop{
  70%{transform:scale(1.15)}
}

/* FOOTER */

footer{
  background:#082e6d;
  color:white;
  text-align:center;
  padding:40px 18px;
}

.footer-links{
  margin-top:18px;
}

.footer-links button{
  border:0;
  background:none;
  color:white;
  margin:5px 10px;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

  .nav{
    flex-wrap:wrap;
  }

  .logo{
    font-size:25px;
  }

  .search-box{
    order:3;
    flex-basis:100%;
  }

  .hero{
    padding:45px 25px;
    min-height:360px;
  }

  .hero h1{
    font-size:38px;
  }

  .hero p{
    font-size:16px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product-img{
    height:150px;
    font-size:62px;
  }

  .product-info{
    padding:12px;
  }

  .product-info h3{
    font-size:15px;
  }

  .wishlist{
    width:38px;
    height:38px;
    font-size:18px;
  }

  .details-btn,
  .customize,
  .add{
    font-size:12px;
    padding:10px;
  }

  .section-title{
    font-size:25px;
  }
}
</style>
</head>

<body>

<!-- LOADER -->
<div class="loader">
  <div class="loader-logo">Printzy</div>
</div>

<!-- HEADER -->
<header>
<div class="nav">

<div class="logo">
Print<span>zy</span>
</div>

<div class="search-box">
<input
class="search"
id="search"
type="search"
placeholder="Search T-shirts, mugs, frames..."
oninput="searchProducts()">
<span class="search-icon">🔍</span>
</div>

<button class="icon-btn" onclick="toggleDark()">
🌙
</button>

<button class="icon-btn" onclick="openWishlist()">
❤️
<span class="count" id="wishCount">0</span>
</button>

<button class="cart-btn" onclick="openCart()">
🛒 Cart <span id="cartCount">0</span>
</button>

</div>
</header>

<!-- HERO -->
<div class="hero-wrap">
<section class="hero">

<div class="circle one"></div>
<div class="circle two"></div>
<div class="circle three"></div>

<h1>Make it yours.</h1>

<p>
Create something special with premium customized
T-shirts, mugs, frames, hoodies and personalized gifts.
</p>

<button class="shop-btn"
onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
Shop Now →
</button>

</section>
</div>

<!-- CONTENT -->
<div class="container">

<h2 class="section-title">
Explore Categories
</h2>

<div class="categories">

<button class="category active"
onclick="filterCategory('All',this)">
All
</button>

<button class="category"
onclick="filterCategory('Clothing',this)">
👕 Clothing
</button>

<button class="category"
onclick="filterCategory('Mugs',this)">
☕ Mugs
</button>

<button class="category"
onclick="filterCategory('Home',this)">
🏠 Home
</button>

<button class="category"
onclick="filterCategory('Accessories',this)">
🎁 Accessories
</button>

</div>

<h2 class="section-title" id="products">
Popular Products
</h2>

<div class="products" id="productList"></div>

</div>

<!-- FOOTER -->
<footer>

<h2>Printzy</h2>

<p style="margin-top:8px">
Premium customized products made specially for you.
</p>

<div class="footer-links">

<button onclick="openTerms()">
Terms & Conditions
</button>

<button onclick="openPrivacy()">
Privacy Policy
</button>

<button onclick="openContact()">
Contact
</button>

</div>

<p style="margin-top:20px">
© 2026 Printzy. All rights reserved.
</p>

</footer>

<!-- MODAL -->
<div class="modal" id="modal">

<div class="modal-box">

<button class="close" onclick="closeModal()">×</button>

<div id="modalContent"></div>

</div>

</div>

<script>

/* ================= PRODUCTS ================= */

const products=[

{
id:1,
name:"Custom T-Shirt",
price:499,
category:"Clothing",
icon:"👕",
badge:"POPULAR",
rating:"4.8",
description:"Premium quality custom printed T-shirt. Add your own name, photo, logo or design.",
features:[
"Premium cotton fabric",
"Custom print available",
"Comfortable regular fit",
"Multiple sizes available"
]
},

{
id:2,
name:"Personalized Mug",
price:299,
category:"Mugs",
icon:"☕",
badge:"BEST SELLER",
rating:"4.9",
description:"Create a personalized ceramic mug with your favourite photo, name or message.",
features:[
"High quality ceramic",
"Photo & text printing",
"Premium finish",
"Perfect for gifting"
]
},

{
id:3,
name:"Photo Frame",
price:399,
category:"Home",
icon:"🖼️",
badge:"NEW",
rating:"4.7",
description:"Turn your favourite memories into beautiful personalized photo frames.",
features:[
"Premium frame",
"Custom photo printing",
"Elegant design",
"Perfect home decoration"
]
},

{
id:4,
name:"Custom Hoodie",
price:899,
category:"Clothing",
icon:"🧥",
badge:"TRENDING",
rating:"4.8",
description:"Premium customized hoodie made for your unique style.",
features:[
"Soft comfortable fabric",
"Custom printing",
"Stylish fit",
"Multiple sizes"
]
},

{
id:5,
name:"Custom Cap",
price:349,
category:"Accessories",
icon:"🧢",
badge:"NEW",
rating:"4.6",
description:"Personalized cap with your name, logo or favourite design.",
features:[
"Premium material",
"Custom embroidery/print",
"Adjustable fit",
"Stylish everyday accessory"
]
},

{
id:6,
name:"Personalized Gift",
price:599,
category:"Accessories",
icon:"🎁",
badge:"POPULAR",
rating:"4.9",
description:"A special personalized gift designed to make your loved ones feel special.",
features:[
"Customizable design",
"Premium presentation",
"Perfect for special occasions",
"Made specially for you"
]
},

{
id:7,
name:"Sunboard",
price:599,
category:"Home Decor",
icon:"🎇",
badge:"POPULAR",
rating:"4.9",
description:"A special personalized Home Decor designed to make your loved ones feel special.",
features:[
"Customizable design",
"Premium presentation",
"Perfect for special occasions",
"Made Special your Home"
]
}

];


/* ================= DATA ================= */

let cart =
JSON.parse(localStorage.getItem("printzyCart")) || [];

let wishlist =
JSON.parse(localStorage.getItem("printzyWishlist")) || [];


/* ================= SHOW PRODUCTS ================= */

function showProducts(list=products){

const box=document.getElementById("productList");

box.innerHTML="";

if(list.length===0){

box.innerHTML=`
<div style="
grid-column:1/-1;
text-align:center;
padding:50px">

<h2>😔 No products found</h2>

<p style="margin-top:10px;color:var(--muted)">
Try another search.
</p>

</div>
`;

return;
}

list.forEach((p,index)=>{

const liked=wishlist.includes(p.name);

box.innerHTML+=`

<div class="product"
style="animation-delay:${index*.07}s">

<button
class="wishlist ${liked?"active":""}"
onclick="toggleWishlist('${p.name}')">

${liked?"♥":"♡"}

</button>

<div class="product-img">

<span class="badge">
${p.badge}
</span>

${p.icon}

</div>

<div class="product-info">

<h3>${p.name}</h3>

<div class="rating">
★★★★★
<span style="color:var(--muted)">
${p.rating}
</span>
</div>

<div class="price">
₹${p.price}
</div>

<button
class="details-btn"
onclick="showProductDetails(${p.id})">

👁️ View Details

</button>

<button
class="customize"
onclick="customizeProduct('${p.name}')">

✨ Customize

</button>

<button
class="add"
onclick="addCart('${p.name}',this)">

Add to Cart

</button>

</div>

</div>

`;

});

}


/* ================= PRODUCT DETAILS ================= */

function showProductDetails(id){

const p=products.find(x=>x.id===id);

if(!p)return;

let features="";

p.features.forEach(f=>{
features+=`<li>✓ ${f}</li>`;
});

showModal(`

<div class="detail-icon">
${p.icon}
</div>

<h2 class="detail-title">
${p.name}
</h2>

<div class="rating">
★★★★★ ${p.rating}/5
</div>

<div class="detail-price">
₹${p.price}
</div>

<p style="line-height:1.7">
${p.description}
</p>

<h3 style="margin-top:18px">
Product Features
</h3>

<ul class="features">
${features}
</ul>

<button class="customize"
onclick="customizeProduct('${p.name}')">

✨ Customize This Product

</button>

<button class="add"
onclick="addCart('${p.name}');closeModal();">

🛒 Add to Cart

</button>

`);

}


/* ================= CUSTOMIZE ================= */

function customizeProduct(name){

showModal(`

<h2>✨ Customize Product</h2>

<p style="color:var(--muted)">
Customize your <strong>${name}</strong>
</p>

<input
class="custom-input"
id="customName"
placeholder="Name / Text">

<input
class="custom-input"
id="customPhoto"
placeholder="Photo / Design details">

<textarea
class="custom-input"
id="customNote"
rows="4"
placeholder="Tell us your customization requirements">
</textarea>

<button
class="add"
onclick="saveCustomization('${name}')">

Save Customization

</button>

`);

}


function saveCustomization(name){

const text=
document.getElementById("customNote").value.trim();

localStorage.setItem(
"printzyCustomization",
JSON.stringify({
product:name,
name:document.getElementById("customName").value,
photo:document.getElementById("customPhoto").value,
note:text
})
);

alert("Customization saved!");

closeModal();

}


/* ================= CART ================= */

function addCart(name,button){

const existing=cart.find(item=>item.name===name);

if(existing){
existing.qty++;
}else{
cart.push({
name:name,
qty:1
});
}

saveCart();

if(button){

button.innerText="✓ Added";

setTimeout(()=>{
button.innerText="Add to Cart";
},900);

}

}


function saveCart(){

localStorage.setItem(
"printzyCart",
JSON.stringify(cart)
);

updateCounts();

}


function updateCounts(){

let count=0;

cart.forEach(item=>{
count+=item.qty;
});

document.getElementById("cartCount").innerText=count;

document.getElementById("wishCount").innerText=wishlist.length;

}


/* ================= WISHLIST ================= */

function toggleWishlist(name){

if(wishlist.includes(name)){

wishlist=wishlist.filter(x=>x!==name);

}else{

wishlist.push(name);

}

localStorage.setItem(
"printzyWishlist",
JSON.stringify(wishlist)
);

updateCounts();
showProducts();

}


function openWishlist(){

let html="<h2>❤️ My Wishlist</h2>";

if(wishlist.length===0){

html+="<p>Your wishlist is empty.</p>";

}else{

wishlist.forEach(name=>{

html+=`

<div class="cart-item">

<span>❤️ ${name}</span>

<button
class="remove"
onclick="removeWishlist('${name}')">

Remove

</button>

</div>

`;

});

}

showModal(html);

}


function removeWishlist(name){

wishlist=wishlist.filter(x=>x!==name);

localStorage.setItem(
"printzyWishlist",
JSON.stringify(wishlist)
);

updateCounts();

openWishlist();
showProducts();

}


/* ================= CART WINDOW ================= */

function openCart(){

let html="<h2>🛒 Your Cart</h2>";

if(cart.length===0){

html+="<p>Your cart is empty.</p>";

showModal(html);
return;

}

let total=0;

cart.forEach((item,index)=>{

const product=products.find(
p=>p.name===item.name
);

const price=product?product.price:0;

total+=price*item.qty;

html+=`

<div class="cart-item">

<div>
<strong>${item.name}</strong>

<div style="
color:var(--blue);
margin-top:5px">

₹${price}

</div>

</div>

<div class="qty">

<button onclick="changeQty(${index},-1)">
−
</button>

<span>${item.qty}</span>

<button onclick="changeQty(${index},1)">
+
</button>

<button
class="remove"
onclick="removeCart(${index})">
×
</button>

</div>

</div>

`;

});

html+=`

<div class="total">
Total: ₹${total}
</div>

<button
class="add"
onclick="openOrderForm()">

🛍️ Order on Printzy

</button>

`;

showModal(html);

}


function changeQty(index,value){

cart[index].qty+=value;

if(cart[index].qty<=0){
cart.splice(index,1);
}

saveCart();

openCart();

}


function removeCart(index){

cart.splice(index,1);

saveCart();

openCart();

}


/* ================= ORDER FORM ================= */

function openOrderForm(){

if(cart.length===0){
alert("Your cart is empty.");
return;
}

let total=0;

cart.forEach(item=>{

const p=products.find(
x=>x.name===item.name
);

if(p){
total+=p.price*item.qty;
}

});

showModal(`

<h2>🛍️ Order on Printzy</h2>

<p style="color:var(--muted)">
Enter your delivery details.
</p>

<input
class="custom-input"
id="orderName"
placeholder="Full Name">

<input
class="custom-input"
id="orderPhone"
type="tel"
placeholder="Mobile Number">

<textarea
class="custom-input"
id="orderAddress"
rows="3"
placeholder="Complete Delivery Address">
</textarea>

<textarea
class="custom-input"
id="orderNote"
rows="3"
placeholder="Customization / Order Notes">
</textarea>

<div class="total">
Total: ₹${total}
</div>

<button
class="add"
onclick="placePrintzyOrder()">

🚀 Place Order on Printzy

</button>

`);

}


/* ================= PLACE ORDER ================= */

function placePrintzyOrder(){

const name=
document.getElementById("orderName").value.trim();

const phone=
document.getElementById("orderPhone").value.trim();

const address=
document.getElementById("orderAddress").value.trim();

const note=
document.getElementById("orderNote").value.trim();

if(!name||!phone||!address){

alert(
"Please enter your name, mobile number and address."
);

return;

}

const phoneNumber=phone.replace(/\D/g,"");

if(phoneNumber.length<10){

alert("Please enter a valid mobile number.");

return;

}

let total=0;

cart.forEach(item=>{

const p=products.find(
x=>x.name===item.name
);

if(p){
total+=p.price*item.qty;
}

});

const orderId=
"PZ"+Date.now().toString().slice(-8);

const order={

orderId:orderId,

customer:{
name:name,
phone:phone,
address:address
},

items:cart,

total:total,

customization:note,

date:new Date().toLocaleString(),

status:"Order Received"

};

localStorage.setItem(
"printzyLastOrder",
JSON.stringify(order)
);

let history=
JSON.parse(
localStorage.getItem("printzyOrders")
) || [];

history.push(order);

localStorage.setItem(
"printzyOrders",
JSON.stringify(history)
);

cart=[];

saveCart();

showModal(`

<div class="success">

<div class="success-icon">
✓
</div>

<h2 style="margin-top:18px">
Order Received!
</h2>

<p style="margin-top:10px">
Thank you <strong>${name}</strong>.
Your order has been received by Printzy.
</p>

<div style="
background:var(--sky);
padding:15px;
border-radius:12px;
margin:18px 0">

<strong>Order ID</strong>

<div style="
color:var(--blue);
font-size:22px;
font-weight:bold;
margin-top:6px">

${orderId}

</div>

</div>

<p>
Total Amount: <strong>₹${total}</strong>
</p>

<button
class="add"
onclick="closeModal()">

Continue Shopping

</button>

</div>

`);

}


/* ================= SEARCH ================= */

function searchProducts(){

const text=
document.getElementById("search")
.value.toLowerCase();

showProducts(
products.filter(p=>
p.name.toLowerCase().includes(text) ||
p.category.toLowerCase().includes(text)
)
);

}


/* ================= CATEGORY ================= */

function filterCategory(category,button){

document.querySelectorAll(".category")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

if(category==="All"){

showProducts();

}else{

showProducts(
products.filter(
p=>p.category===category
)
);

}

}

}
