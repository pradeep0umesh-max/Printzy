<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Printzy - Custom Products</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --blue:#1264e8;
  --blue2:#0645b5;
  --sky:#eaf3ff;
  --bg:#f6f9ff;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#dce7f7;
  --danger:#ef3155;
  --success:#16a34a;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  transition:.3s;
}

body.dark{
  --bg:#08111f;
  --card:#111c2d;
  --text:#f5f8ff;
  --muted:#aab6ca;
  --border:#263852;
  --sky:#12243d;
}

/* LOADER */
.loader{
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:hideLoader .7s ease 1.2s forwards;
}

.loader-logo{
  color:var(--blue);
  font-size:44px;
  font-weight:900;
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(.9);opacity:.5}
  to{transform:scale(1.08);opacity:1}
}

@keyframes hideLoader{
  to{opacity:0;visibility:hidden}
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

body.dark header{
  background:rgba(17,28,45,.95);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  font-size:29px;
  font-weight:900;
  color:var(--blue);
}

.logo span{color:var(--text)}

.search-box{
  flex:1;
  position:relative;
}

.search{
  width:100%;
  padding:13px 45px 13px 18px;
  border:2px solid var(--border);
  border-radius:30px;
  background:var(--card);
  color:var(--text);
  outline:none;
  font-size:15px;
}

.search:focus{
  border-color:var(--blue);
}

.search-icon{
  position:absolute;
  right:17px;
  top:12px;
}

.icon-btn{
  width:45px;
  height:45px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-size:19px;
  position:relative;
}

.count{
  position:absolute;
  top:-4px;
  right:-2px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:var(--danger);
  color:white;
  font-size:11px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.cart-btn{
  border:0;
  background:var(--blue);
  color:white;
  padding:13px 18px;
  border-radius:28px;
  font-weight:bold;
  cursor:pointer;
}

/* HERO */
.hero-wrap{
  max-width:1200px;
  margin:25px auto;
  padding:0 18px;
}

.hero{
  min-height:390px;
  border-radius:30px;
  padding:65px 50px;
  color:white;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#0755ca,#1684ff);
  box-shadow:0 20px 45px rgba(18,100,232,.25);
}

.hero h1{
  font-size:54px;
  margin-bottom:18px;
  position:relative;
  z-index:2;
}

.hero p{
  font-size:18px;
  max-width:650px;
  line-height:1.7;
  position:relative;
  z-index:2;
}

.shop-btn{
  margin-top:27px;
  padding:14px 25px;
  border:0;
  border-radius:30px;
  background:white;
  color:var(--blue);
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.circle{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.12);
}

.one{
  width:230px;
  height:230px;
  right:-50px;
  top:-60px;
}

.two{
  width:150px;
  height:150px;
  right:230px;
  bottom:-70px;
}

.three{
  width:80px;
  height:80px;
  right:80px;
  bottom:70px;
}

/* CONTENT */
.container{
  max-width:1200px;
  margin:auto;
  padding:10px 18px 60px;
}

.section-title{
  font-size:30px;
  margin:32px 0 18px;
}

/* CATEGORIES */
.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:8px;
}

.category{
  white-space:nowrap;
  padding:11px 20px;
  border-radius:30px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}

.category.active{
  background:var(--blue);
  color:white;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.product{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
  position:relative;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
  transition:.25s;
}

.product:hover{
  transform:translateY(-7px);
  box-shadow:0 15px 35px rgba(18,100,232,.15);
}

.product-img{
  height:215px;
  background:linear-gradient(145deg,#edf5ff,#dcecff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:90px;
  position:relative;
}

body.dark .product-img{
  background:#152944;
}

.badge{
  position:absolute;
  top:13px;
  left:13px;
  background:var(--blue);
  color:white;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.wishlist{
  position:absolute;
  right:13px;
  top:13px;
  width:43px;
  height:43px;
  border:1px solid #d9e5f6;
  border-radius:50%;
  background:white;
  color:#64748b;
  font-size:23px;
  cursor:pointer;
  z-index:3;
}

.wishlist.active{
  color:var(--danger);
  background:#fff0f3;
}

.product-info{
  padding:18px;
}

.product-info h3{
  margin-bottom:7px;
}

.rating{
  color:#f59e0b;
  font-size:13px;
  margin-bottom:8px;
}

.price{
  color:var(--blue);
  font-size:20px;
  font-weight:bold;
}

.details-btn,
.customize,
.add{
  width:100%;
  margin-top:10px;
  padding:11px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.details-btn,
.customize{
  border:1px solid var(--blue);
  background:transparent;
  color:var(--blue);
}

.add{
  border:0;
  background:var(--blue);
  color:white;
}

.add:hover{
  background:var(--blue2);
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:5000;
  background:rgba(0,0,0,.65);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-width:570px;
  max-height:90vh;
  overflow:auto;
  padding:25px;
  background:var(--card);
  color:var(--text);
  border-radius:24px;
}

.close{
  float:right;
  border:0;
  background:none;
  color:var(--text);
  font-size:30px;
  cursor:pointer;
}

.detail-icon{
  height:190px;
  border-radius:18px;
  background:linear-gradient(145deg,#edf5ff,#dcecff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:100px;
  margin-bottom:20px;
}

.detail-title{
  font-size:28px;
  margin-bottom:8px;
}

.detail-price{
  color:var(--blue);
  font-size:25px;
  font-weight:bold;
  margin:12px 0;
}

.features{
  margin:15px 0;
  padding-left:20px;
  line-height:2;
}

.custom-input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}

.cart-item{
  padding:14px 0;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:var(--sky);
  color:var(--blue);
  cursor:pointer;
  font-weight:bold;
}

.remove{
  border:0;
  background:#fff0f3;
  color:var(--danger);
  padding:7px 10px;
  border-radius:8px;
  cursor:pointer;
}

.total{
  color:var(--blue);
  font-size:21px;
  font-weight:bold;
  margin:18px 0;
}

.success{
  text-align:center;
}

.success-icon{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:50%;
  background:#e8f7ee;
  color:var(--success);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
}

.order-box{
  background:var(--sky);
  padding:15px;
  border-radius:13px;
  margin:15px 0;
}

.order-number{
  color:var(--blue);
  font-size:22px;
  font-weight:bold;
}

/* FOOTER */
footer{
  background:#082e6d;
  color:white;
  text-align:center;
  padding:40px 18px;
}

.footer-links{
  margin-top:18px;
}

.footer-links button{
  border:0;
  background:none;
  color:white;
  margin:5px 10px;
  cursor:pointer;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#172033;
  color:white;
  padding:13px 20px;
  border-radius:30px;
  z-index:10000;
  transition:.3s;
  opacity:0;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

/* MOBILE */
@media(max-width:700px){

  .nav{flex-wrap:wrap}

  .logo{font-size:25px}

  .search-box{
    order:3;
    flex-basis:100%;
  }

  .cart-btn{
    padding:11px 13px;
  }

  .hero{
    padding:45px 25px;
    min-height:360px;
  }

  .hero h1{
    font-size:38px;
  }

  .hero p{
    font-size:16px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product-img{
    height:150px;
    font-size:62px;
  }

  .product-info{
    padding:12px;
  }

  .product-info h3{
    font-size:15px;
  }

  .wishlist{
    width:38px;
    height:38px;
    font-size:18px;
  }

  .details-btn,
  .customize,
  .add{
    font-size:12px;
    padding:10px;
  }

  .section-title{
    font-size:25px;
  }
}
</style>
</head>

<body>

<!-- LOADER -->
<div class="loader">
  <div class="loader-logo">Printzy</div>
</div>

<!-- HEADER -->
<header>
<div class="nav">

<div class="logo">
Print<span>zy</span>
</div>

<div class="search-box">
<input
class="search"
id="search"
type="search"
placeholder="Search T-shirts, mugs, frames..."
oninput="searchProducts()">
<span class="search-icon">🔍</span>
</div>

<button class="icon-btn" onclick="toggleDark()" title="Dark Mode">
🌙
</button>

<button class="icon-btn" onclick="openWishlist()" title="Wishlist">
❤️
<span class="count" id="wishCount">0</span>
</button>

<button class="cart-btn" onclick="openCart()">
🛒 Cart <span id="cartCount">0</span>
</button>

</div>
</header>

<!-- HERO -->
<div class="hero-wrap">
<section class="hero">

<div class="circle one"></div>
<div class="circle two"></div>
<div class="circle three"></div>

<h1>Make it yours.</h1>

<p>
Create something special with premium customized
T-shirts, mugs, frames, hoodies, caps and personalized gifts.
</p>

<button
class="shop-btn"
onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
Shop Now →
</button>

</section>
</div>

<!-- MAIN -->
<div class="container">

<h2 class="section-title">
Explore Categories
</h2>

<div class="categories">

<button class="category active"
onclick="filterCategory('All',this)">
All
</button>

<button class="category"
onclick="filterCategory('Clothing',this)">
👕 Clothing
</button>

<button class="category"
onclick="filterCategory('Mugs',this)">
☕ Mugs
</button>

<button class="category"
onclick="filterCategory('Home',this)">
🏠 Home
</button>

<button class="category"
onclick="filterCategory('Accessories',this)">
🎁 Accessories
</button>

</div>

<h2 class="section-title" id="products">
Popular Products
</h2>

<div class="products" id="productList"></div>

</div>

<!-- FOOTER -->
<footer>

<h2>Printzy</h2>

<p style="margin-top:8px">
Premium customized products made specially for you.
</p>

<div class="footer-links">

<button onclick="openTerms()">Terms & Conditions</button>
<button onclick="openPrivacy()">Privacy Policy</button>
<button onclick="openContact()">Contact</button>
<button onclick="openOrderHistory()">Order History</button>

</div>

<p style="margin-top:20px">
© 2026 Printzy. All rights reserved.
</p>

</footer>

<!-- MODAL -->
<div class="modal" id="modal">

<div class="modal-box">

<button class="close" onclick="closeModal()">×</button>

<div id="modalContent"></div>

</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

/* ================= PRODUCTS ================= */

const products=[

{
id:1,
name:"Custom T-Shirt",
price:499,
category:"Clothing",
icon:"👕",
badge:"POPULAR",
rating:"4.8",
description:"Premium quality custom printed T-shirt. Add your own name, photo, logo or design.",
features:[
"Premium cotton fabric",
"Custom print available",
"Comfortable regular fit",
"Multiple sizes available"
]
},

{
id:2,
name:"Personalized Mug",
price:299,
category:"Mugs",
icon:"☕",
badge:"BEST SELLER",
rating:"4.9",
description:"Create a personalized ceramic mug with your favourite photo, name or message.",
features:[
"High quality ceramic",
"Photo & text printing",
"Premium finish",
"Perfect for gifting"
]
},

{
id:3,
name:"Photo Frame",
price:399,
category:"Home",
icon:"🖼️",
badge:"NEW",
rating:"4.7",
description:"Turn your favourite memories into beautiful personalized photo frames.",
features:[
"Premium frame",
"Custom photo printing",
"Elegant design",
"Perfect home decoration"
]
},

{
id:4,
name:"Custom Hoodie",
price:899,
category:"Clothing",
icon:"🧥",
badge:"TRENDING",
rating:"4.8",
description:"Premium customized hoodie made for your unique style.",
features:[
"Soft comfortable fabric",
"Custom printing",
"Stylish fit",
"Multiple sizes"
]
},

{
id:5,
name:"Custom Cap",
price:349,
category:"Accessories",
icon:"🧢",
badge:"NEW",
rating:"4.6",
description:"Personalized cap with your name, logo or favourite design.",
features:[
"Premium material",
"Custom embroidery or print",
"Adjustable fit",
"Stylish everyday accessory"
]
},

{
id:6,
name:"Personalized Gift",
price:599,
category:"Accessories",
icon:"🎁",
badge:"POPULAR",
rating:"4.9",
description:"A special personalized gift designed to make your loved ones feel special.",
features:[
"Customizable design",
"Premium presentation",
"Perfect for special occasions",
"Made specially for you"
]
},

{
id:7,
name:"Custom Home Decor",
price:599,
category:"Home",
icon:"🏠",
badge:"POPULAR",
rating:"4.8",
description:"Personalized home decor created especially for your room and memories.",
features:[
"Customizable design",
"Premium presentation",
"Perfect for home decoration",
"Made specially for you"
]
},

{
id:8,
name:"Custom Keychain",
price:199,
category:"Accessories",
icon:"🔑",
badge:"NEW",
rating:"4.7",
description:"Personalized keychain with your name, photo or special message.",
features:[
"Lightweight",
"Custom design",
"Durable material",
"Great gift option"
]
},

{
id:9,
name:"Custom Phone Case",
price:449,
category:"Accessories",
icon:"📱",
badge:"TRENDING",
rating:"4.8",
description:"Protect your phone with a stylish personalized phone case.",
features:[
"Custom photo printing",
"Protective case",
"Premium finish",
"Multiple phone models"
]
}

];


/* ================= DATA ================= */

let cart=JSON.parse(localStorage.getItem("printzyCart")) || [];
let wishlist=JSON.parse(localStorage.getItem("printzyWishlist")) || [];
let orders=JSON.parse(localStorage.getItem("printzyOrders")) || [];
let selectedCategory="All";


/* ================= PRODUCTS ================= */

function showProducts(list=products){

const box=document.getElementById("productList");

box.innerHTML="";

if(list.length===0){

box.innerHTML=`
<div style="grid-column:1/-1;text-align:center;padding:50px">
<h2>😔 No products found</h2>
<p style="margin-top:10px;color:var(--muted)">
Try another search.
</p>
</div>`;

return;
}

list.forEach((p,index)=>{

const liked=wishlist.includes(p.id);

box.innerHTML+=`

<div class="product">

<button
class="wishlist ${liked?"active":""}"
onclick="toggleWishlist(${p.id})">

${liked?"♥":"♡"}

</button>

<div class="product-img">

<span class="badge">
${p.badge}
</span>

${p.icon}

</div>

<div class="product-info">

<h3>${p.name}</h3>

<div class="rating">
★★★★★
<span style="color:var(--muted)">
${p.rating}
</span>
</div>

<div class="price">
₹${p.price}
</div>

<button
class="details-btn"
onclick="showProductDetails(${p.id})">

👁️ View Details

</button>

<button
class="customize"
onclick="customizeProduct(${p.id})">

✨ Customize

</button>

<button
class="add"
onclick="addCart(${p.id},this)">

🛒 Add to Cart

</button>

</div>
</div>
`;

});

}


/* ================= DETAILS ================= */

function showProductDetails(id){

const p=products.find(x=>x.id===id);

if(!p)return;

let features="";

p.features.forEach(f=>{
features+=`<li>✓ ${f}</li>`;
});

showModal(`

<div class="detail-icon">
${p.icon}
</div>

<h2 class="detail-title">
${p.name}
</h2>

<div class="rating">
★★★★★ ${p.rating}/5
</div>

<div class="detail-price">
₹${p.price}
</div>

<p style="line-height:1.7">
${p.description}
</p>

<h3 style="margin-top:18px">
Product Features
</h3>

<ul class="features">
${features}
</ul>

<button
class="customize"
onclick="customizeProduct(${p.id})">

✨ Customize This Product

</button>

<button
class="add"
onclick="addCart(${p.id});closeModal()">

🛒 Add to Cart

</button>

`);

}


/* ================= CUSTOMIZE ================= */

function customizeProduct(id){

const p=products.find(x=>x.id===id);

if(!p)return;

showModal(`

<h2>✨ Customize Product</h2>

<p style="color:var(--muted);margin:10px 0">
Customize your <strong>${p.name}</strong>
</p>

<input
class="custom-input"
id="customName"
placeholder="Name / Text">

<input
class="custom-input"
id="customDesign"
placeholder="Photo / Design details">

<textarea
class="custom-input"
id="customNote"
rows="4"
placeholder="Customization requirements"></textarea>

<button
class="add"
onclick="saveCustomization(${id})">

💾 Save Customization

</button>

`);

}

function saveCustomization(id){

const p=products.find(x=>x.id===id);

const data={
product:p.name,
name:document.getElementById("customName").value,
design:document.getElementById("customDesign").value,
note:document.getElementById("customNote").value,
date:new Date().toLocaleString()
};

localStorage.setItem(
"printzyCustomization",
JSON.stringify(data)
);

showToast("Customization saved ✓");
closeModal();

}


/* ================= CART ================= */

function addCart(id,button){

const existing=cart.find(item=>item.id===id);

if(existing){
existing.qty++;
}else{
cart.push({
id:id,
qty:1
});
}

saveCart();

if(button){

button.innerText="✓ Added";

setTimeout(()=>{
button.innerText="🛒 Add to Cart";
},900);

}

showToast("Product added to cart ✓");

}

function saveCart(){

localStorage.setItem(
"printzyCart",
JSON.stringify(cart)
);

updateCounts();

}

function updateCounts(){

let count=0;

cart.forEach(item=>{
count+=item.qty;
});

document.getElementById("cartCount").innerText=count;
document.getElementById("wishCount").innerText=wishlist.length;

}


/* ================= CART WINDOW ================= */

function openCart(){

let html="<h2>🛒 Your Cart</h2>";

if(cart.length===0){

html+=`
<p style="margin-top:20px;color:var(--muted)">
Your cart is empty.
</p>`;

showModal(html);
return;
}

let total=0;

cart.forEach((item,index)=>{

const p=products.find(x=>x.id===item.id);

if(!p)return;

total+=p.price*item.qty;

html+=`

<div class="cart-item">

<div>
<strong>${p.icon} ${p.name}</strong>

<div style="color:var(--blue);margin-top:5px">
₹${p.price}
</div>
</div>

<div>

<div class="qty">

<button onclick="changeQty(${index},-1)">
−
</button>

<strong>${item.qty}</strong>

<button onclick="changeQty(${index},1)">
+
</button>

</div>

<button
class="remove"
style="margin-top:7px"
onclick="removeCart(${index})">

Remove

</button>

</div>

</div>

`;

});

html+=`

<div class="total">
Total: ₹${total}
</div>

<button
class="add"
onclick="checkout()">

💳 Proceed to Checkout

</button>

<button
class="customize"
onclick="closeModal()">

Continue Shopping

</button>

`;

showModal(html);

}

function changeQty(index,amount){

if(!cart[index])return;

cart[index].qty+=amount;

if(cart[index].qty<=0){
cart.splice(index,1);
}

saveCart();
openCart();

}

function removeCart(index){

cart.splice(index,1);

saveCart();
openCart();

showToast("Product removed");

}


/* ================= CHECKOUT ================= */

function checkout(){

if(cart.length===0){
showToast("Cart is empty");
return;
}

let total=0;

cart.forEach(item=>{

const p=products.find(x=>x.id===item.id);

if(p){
total+=p.price*item.qty;
}

});

showModal(`

<h2>📦 Checkout</h2>

<p style="color:var(--muted);margin:10px 0 15px">
Enter your delivery details.
</p>

<input
class="custom-input"
id="customerName"
placeholder="Full Name">

<input
class="custom-input"
id="customerPhone"
placeholder="Mobile Number"
type="tel">

<textarea
class="custom-input"
id="customerAddress"
rows="4"
placeholder="Full Delivery Address"></textarea>

<p class="total">
Total: ₹${total}
</p>

<button
class="add"
onclick="placeOrder()">

✅ Place Order

</button>

`);

}


/* ================= PLACE ORDER ================= */

function placeOrder(){

const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const address=document.getElementById("customerAddress").value.trim();

if(!name || !phone || !address){

showToast("Please fill all details");

return;
}

let total=0;

cart.forEach(item=>{

const p=products.find(x=>x.id===item.id);

if(p){
total+=p.price*item.qty;
}

});

const orderId=
"PZ"+Date.now().toString().slice(-8);

const order={
id:orderId,
name:name,
phone:phone,
address:address,
items:[...cart],
total:total,
date:new Date().toLocaleString(),
status:"Order Placed"
};

orders.unshift(order);

localStorage.setItem(
"printzyOrders",
JSON.stringify(orders)
);

cart=[];

saveCart();

showModal(`

<div class="success">

<div class="success-icon">
✓
</div>

<h2 style="margin-top:18px">
Order Placed Successfully!
</h2>

<div class="order-box">

<p>Your Order Number</p>

<div class="order-number">
${orderId}
</div>

</div>

<p style="color:var(--muted)">
Thank you for shopping with Printzy.
</p>

<button
class="add"
onclick="closeModal()">

Continue Shopping

</button>

</div>

`);

}


/* ================= WISHLIST ================= */

function toggleWishlist(id){

if(wishlist.includes(id)){

wishlist=wishlist.filter(x=>x!==id);

showToast("Removed from wishlist");

}else{

wishlist.push(id);

showToast("Added to wishlist ❤️");

}

localStorage.setItem(
"printzyWishlist",
JSON.stringify(wishlist)
);

updateCounts();

applyFilters();

}

function openWishlist(){

let html="<h2>❤️ My Wishlist</h2>";

if(wishlist.length===0){

html+=`
<p style="margin-top:20px;color:var(--muted)">
Your wishlist is empty.
</p>`;

}else{

wishlist.forEach(id=>{

const p=products.find(x=>x.id===id);

if(!p)return;

html+=`

<div class="cart-item">

<div>
<strong>${p.icon} ${p.name}</strong>

<div style="color:var(--blue);margin-top:5px">
₹${p.price}
</div>
</div>

<button
class="remove"
onclick="removeWishlist(${id})">

Remove

</button>

</div>

`;

});

}

showModal(html);

}

function removeWishlist(id){

wishlist=wishlist.filter(x=>x!==id);

localStorage.setItem(
"printzyWishlist",
JSON.stringify(wishlist)
);

updateCounts();
openWishlist();
applyFilters();

}


/* ================= SEARCH ================= */

function searchProducts(){

applyFilters();

}

function applyFilters(){

const query=
document.getElementById("search").value
.toLowerCase()
.trim();

let list=products.filter(p=>{

const categoryMatch=
selectedCategory==="All" ||
p.category===selectedCategory;

const searchMatch=
p.name.toLowerCase().includes(query) ||
p.description.toLowerCase().includes(query) ||
p.category.toLowerCase().includes(query);

return categoryMatch && searchMatch;

});

showProducts(list);

}


/* ================= CATEGORY ================= */

function filterCategory(category,button){

selectedCategory=category;

document.querySelectorAll(".category")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

applyFilters();

}


/* ================= DARK MODE ================= */

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"printzyDark",
document.body.classList.contains("dark")
);

}

}

/* ================= MODAL ================= */

function showModal(content){

document.getElementById("modalContent").innerHTML=content;

document.getElementById("modal").classList.add("show");

}

function closeModal(){

document.getElementById("modal").classList.remove("show");

}

document.getElementById("modal").addEventListener("click",function(e){

if(e.target===this){
closeModal();
}

});


/* ================= TOAST ================= */

let toastTimer;

function showToast(message){

const toast=document.getElementById("toast");

toast.innerText=message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer=setTimeout(()=>{

toast.classList.remove("show");

},1800);

}


/* ================= INITIALIZE ================= */

if(localStorage.getItem("printzyDark")==="true"){
document.body.classList.add("dark");
}

updateCounts();
showProducts();
