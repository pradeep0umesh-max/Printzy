<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Printzy - Custom Printed Products</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f8;
  color:#171717;
}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:white;
  border-bottom:1px solid #ddd;
}
.top{
  max-width:1100px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:14px;
}
.logo{
  font-size:26px;
  font-weight:800;
}
.search{
  flex:1;
  padding:13px 16px;
  border:1px solid #ddd;
  border-radius:25px;
  font-size:15px;
}
.cartBtn{
  border:0;
  background:#111;
  color:white;
  border-radius:25px;
  padding:12px 18px;
  font-weight:bold;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:22px 18px;
}
.hero{
  background:#111;
  color:white;
  border-radius:25px;
  padding:40px 24px;
  margin-bottom:35px;
}
.hero h1{font-size:42px;margin-bottom:15px}
.hero p{font-size:18px;line-height:1.6;max-width:650px}
.hero button{
  margin-top:22px;
  padding:14px 25px;
  border:0;
  border-radius:25px;
  font-weight:bold;
}
h2{margin-bottom:18px}
.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:25px;
}
.categories button{
  white-space:nowrap;
  padding:11px 20px;
  border:1px solid #ddd;
  background:white;
  border-radius:25px;
}
.categories button.active{
  background:#111;
  color:white;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}
.card{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:18px;
  overflow:hidden;
}
.productImg{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  font-size:80px;
}
.info{padding:16px}
.info h3{margin-bottom:8px}
.price{
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}
.add{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  font-weight:bold;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.box{
  background:white;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:22px;
}
.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
}
.cartItem{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}
.qty button{
  padding:5px 10px;
  border:1px solid #ddd;
  background:white;
}
.total{
  font-size:22px;
  font-weight:bold;
  margin:20px 0;
}
.order{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#25D366;
  color:white;
  font-weight:bold;
  font-size:16px;
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:1px solid #ddd;
  border-radius:9px;
}
footer{
  margin-top:50px;
  padding:30px;
  text-align:center;
  background:#111;
  color:white;
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">Printzy</div>

    <input
      class="search"
      id="search"
      placeholder="Search t-shirts, mugs, frames..."
      oninput="renderProducts()"
    >

    <button class="cartBtn" onclick="openCart()">
      Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</header>

<main class="container">

<section class="hero">
  <h1>Make it yours.</h1>
  <p>
    Discover customizable products and turn your photos,
    names and ideas into something special.
  </p>
  <button onclick="document.getElementById('products').scrollIntoView()">
    Shop Now
  </button>
</section>

<h2>Categories</h2>

<div class="categories">
  <button class="active" onclick="setCategory('All',this)">All</button>
  <button onclick="setCategory('Clothing',this)">Clothing</button>
  <button onclick="setCategory('Mugs',this)">Mugs</button>
  <button onclick="setCategory('Home',this)">Home</button>
  <button onclick="setCategory('Accessories',this)">Accessories</button>
</div>

<h2 id="products">Popular Products</h2>

<div class="grid" id="productGrid"></div>

</main>

<footer>
  <h2>Printzy</h2>
  <p>Customize it. Print it. Love it.</p>
  <br>
  <p>© 2026 Printzy</p>
</footer>

<!-- CART -->
<div class="modal" id="cartModal">
<div class="box">

<button class="close" onclick="closeCart()">×</button>

<h2>Your Cart</h2>

<div id="cartItems"></div>

<div class="total">
Total: ₹<span id="cartTotal">0</span>
</div>

<h3>Order Details</h3>

<input id="customerName" placeholder="Your Name">
<input id="customerPhone" placeholder="Phone Number">
<textarea id="customerAddress" placeholder="Delivery Address"></textarea>

<button class="order" onclick="orderWhatsApp()">
  Order on WhatsApp
</button>

</div>
</div>

<script>

const products = [

{
 id:1,
 name:"Custom T-Shirt",
 price:499,
 category:"Clothing",
 icon:"👕"
},

{
 id:2,
 name:"Custom Coffee Mug",
 price:299,
 category:"Mugs",
 icon:"☕"
},

{
 id:3,
 name:"Photo Frame",
 price:399,
 category:"Home",
 icon:"🖼️"
},

{
 id:4,
 name:"Custom Hoodie",
 price:899,
 category:"Clothing",
 icon:"🧥"
},

{
 id:5,
 name:"Custom Keychain",
 price:199,
 category:"Accessories",
 icon:"🔑"
},

{
 id:6,
 name:"Custom Cushion",
 price:449,
 category:"Home",
 icon:"🛋️"
},

{
 id:7,
 name:"Custom Cap",
 price:349,
 category:"Accessories",
 icon:"🧢"
},

{
 id:8,
 name:"Couple T-Shirt",
 price:799,
 category:"Clothing",
 icon:"👕"
}

];

let cart=[];
let category="All";

function renderProducts(){

 const search=document
 .getElementById("search")
 .value
 .toLowerCase();

 const grid=document.getElementById("productGrid");

 let list=products.filter(p=>{

   const matchCategory=
   category==="All" || p.category===category;

   const matchSearch=
   p.name.toLowerCase().includes(search);

   return matchCategory && matchSearch;

 });

 grid.innerHTML=list.map(p=>`

 <div class="card">

   <div class="productImg">
     ${p.icon}
   </div>

   <div class="info">

     <h3>${p.name}</h3>

     <div>${p.category}</div>

     <div class="price">
       ₹${p.price}
     </div>

     <button class="add"
       onclick="addToCart(${p.id})">
       Add to Cart
     </button>

   </div>

 </div>

 `).join("");

}

function setCategory(cat,button){

 category=cat;

 document
 .querySelectorAll(".categories button")
 .forEach(b=>b.classList.remove("active"));

 button.classList.add("active");

 renderProducts();

}

function addToCart(id){

 const item=cart.find(x=>x.id===id);

 if(item){
   item.qty++;
 }else{
   const product=products.find(x=>x.id===id);
   cart.push({...product,qty:1});
 }

 updateCart();

 alert("Product added to cart!");

}

function updateCart(){

 let count=0;

 cart.forEach(x=>count+=x.qty);

 document.getElementById("cartCount").innerText=count;

}

function openCart(){

 document.getElementById("cartModal").style.display="flex";

 renderCart();

}

function closeCart(){

 document.getElementById("cartModal").style.display="none";

}

function renderCart(){

 const box=document.getElementById("cartItems");

 if(cart.length===0){

   box.innerHTML="<p>Your cart is empty.</p>";

   document.getElementById("cartTotal").innerText="0";

   return;

 }

 let total=0;

 box.innerHTML=cart.map(item=>{

   total+=item.price*item.qty;

   return `

   <div class="cartItem">

     <div>
       <b>${item.name}</b><br>
       ₹${item.price} × ${item.qty}
     </div>

     <div class="qty">

       <button onclick="changeQty(${item.id},-1)">
       −
       </button>

       <button onclick="changeQty(${item.id},1)">
       +
       </button>

     </div>

   </div>

   `;

 }).join("");

 document.getElementById("cartTotal").innerText=total;

}

function changeQty(id,change){

 const item=cart.find(x=>x.id===id);

 if(!item)return;

 item.qty+=change;

 if(item.qty<=0){

   cart=cart.filter(x=>x.id!==id);

 }

 updateCart();
 renderCart();

}

function orderWhatsApp(){

 if(cart.length===0){

   alert("Cart is empty!");

   return;

 }

 const name=document
 .getElementById("customerName").value;

 const phone=document
 .getElementById("customerPhone").value;

 const address=document
 .getElementById("customerAddress").value;

 if(!name || !phone || !address){

   alert("Please fill all details.");

   return;

 }

 let message=
 `*New Printzy Order*%0A%0A`;

 message+=`Name: ${name}%0A`;
 message+=`Phone: ${phone}%0A`;
 message+=`Address: ${address}%0A%0A`;

 message+=`*Products:*%0A`;

 let total=0;

 cart.forEach(item=>{

   const amount=item.price*item.qty;

   total+=amount;

   message+=
   `${item.name} × ${item.qty} = ₹${amount}%0A`;

 });

 message+=`%0A*Total: ₹${total}*`;

 /*
  CHANGE THIS NUMBER
  Replace 919201791396 with
  your WhatsApp number including country code.
 */

 const whatsappNumber="919201791396";

 window.open(
 `https://wa.me/${whatsappNumber}?text=${message}`,
 "_blank"
 );

}

renderProducts();

</script>

</body>
</html>
