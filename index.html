<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printzy</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7f8;color:#171717}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;z-index:5}.top{max-width:1100px;margin:auto;padding:14px;display:flex;gap:12px;align-items:center}.logo{font-size:26px;font-weight:800}.search{flex:1;padding:12px;border:1px solid #ddd;border-radius:24px}.cartBtn,.add{background:#111;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:bold}.cartBtn{border-radius:24px}.container{max-width:1100px;margin:auto;padding:20px}.hero{background:#111;color:#fff;border-radius:22px;padding:38px 22px;margin-bottom:30px}.hero h1{font-size:42px;margin:0 0 12px}.hero button{padding:13px 22px;border:0;border-radius:24px}.categories{display:flex;gap:10px;overflow:auto;margin-bottom:25px}.categories button{white-space:nowrap;padding:10px 16px;border:1px solid #ddd;background:#fff;border-radius:20px}.categories .active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden}.pic{height:190px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:70px}.info{padding:14px}.price{font-weight:800;font-size:20px;margin:10px 0}.add{width:100%}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:15px}.box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd}input,textarea,select{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ddd;border-radius:8px}.order{width:100%;padding:14px;border:0;border-radius:10px;background:#25d366;color:#fff;font-weight:bold}
</style></head><body>
<header><div class="top"><div class="logo">Printzy</div><input id="search" class="search" placeholder="Search products..." oninput="render()"><button class="cartBtn" onclick="openCart()">Cart (<span id="count">0</span>)</button></div></header>
<main class="container"><section class="hero"><h1>Make it yours.</h1><p>Custom printed products made for you.</p><button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now</button></section>
<h2>Categories</h2><div class="categories" id="cats"></div><h2 id="products">Popular Products</h2><div class="grid" id="grid"></div></main>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeCart()">×</button><h2>Your Cart</h2><div id="items"></div><h3>Total: ₹<span id="total">0</span></h3><h3>Order Details</h3><input id="name" placeholder="Your Name"><input id="email" type="email" placeholder="Email Address"><input id="pin" placeholder="Pincode"><textarea id="address" placeholder="Full Delivery Address"></textarea><select id="payment"><option>Cash on Delivery</option><option>UPI / Online Payment</option></select><button class="order" onclick="order()">Place Order on WhatsApp</button></div></div>
<script>
const products=[["Custom T-Shirt",499,"Clothing","👕"],["Custom Coffee Mug",299,"Mugs","☕"],["Photo Frame",399,"Home","🖼️"],["Custom Hoodie",899,"Clothing","🧥"],["Custom Keychain",199,"Accessories","🔑"],["Custom Cushion",449,"Home","🛋️"],["Custom Cap",349,"Accessories","🧢"],["Couple T-Shirt",799,"Clothing","👕"]];
let cart=[],cat="All";
function render(){let q=document.getElementById("search").value.toLowerCase();let cats=["All",...new Set(products.map(p=>p[2]))];document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${c==cat?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("");let list=products.filter(p=>(cat=="All"||p[2]==cat)&&p[0].toLowerCase().includes(q));document.getElementById("grid").innerHTML=list.map((p,i)=>`<div class="card"><div class="pic">${p[3]}</div><div class="info"><b>${p[0]}</b><div>${p[2]}</div><div class="price">₹${p[1]}</div><button class="add" onclick="add(${products.indexOf(p)})">Add to Cart</button></div></div>`).join("");document.getElementById("count").textContent=cart.reduce((a,x)=>a+x.q,0)}
function setCat(c){cat=c;render()} function add(i){let x=cart.find(x=>x.i==i);x?x.q++:cart.push({i,q:1});render();alert("Added to cart!")} function openCart(){document.getElementById("modal").style.display="flex";showCart()} function closeCart(){document.getElementById("modal").style.display="none"}
function showCart(){let t=0;document.getElementById("items").innerHTML=cart.length?cart.map(x=>{let p=products[x.i];t+=p[1]*x.q;return `<div class="item"><span>${p[3]} ${p[0]} × ${x.q}</span><span><button onclick="qty(${x.i},-1)">−</button><button onclick="qty(${x.i},1)">+</button></span></div>`}).join(""):"<p>Cart is empty.</p>";document.getElementById("total").textContent=t}
function qty(i,d){let x=cart.find(x=>x.i==i);if(x){x.q+=d;if(x.q<1)cart=cart.filter(y=>y.i!=i)}render();showCart()}
function order(){if(!cart.length)return alert("Cart is empty!");let name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),pin=document.getElementById("pin").value.trim(),address=document.getElementById("address").value.trim(),payment=document.getElementById("payment").value;if(!name||!email||!pin||!address)return alert("Please fill Name, Email, Pincode and Address.");let n=+(localStorage.getItem("printzyNo")||1000)+1;localStorage.setItem("printzyNo",n);let id="PRZ-"+n,total=0,msg=`*New Printzy Order*%0AOrder ID: ${id}%0AName: ${name}%0AEmail: ${email}%0APincode: ${pin}%0AAddress: ${address}%0APayment: ${payment}%0A%0A*Products:*%0A`;cart.forEach(x=>{let p=products[x.i],a=p[1]*x.q;total+=a;msg+=`${p[0]} x ${x.q} = ₹${a}%0A`});msg+=`%0A*Total: ₹${total}*`;let whatsappNumber="919999999999";window.open(`https://wa.me/${whatsappNumber}?text=${msg}`,"_blank")}
render();
</script></body></html>
